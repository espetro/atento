name: Version

# Opens (or updates) the "Version Packages" PR from pending changesets. When
# that PR merges there are no changesets left, so the action's publish step
# runs: it tags the release and dispatches release.yml.
on:
  push:
    branches: [main]

concurrency: version-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release:tag
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
