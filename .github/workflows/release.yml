name: Release

# Builds the CLI/MCP tarballs and the desktop apps for a tag, then publishes
# the GitHub Release with the notes of the matching CHANGELOG.md section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v0.1.0), or a branch with dry_run
        required: true
      dry_run:
        description: Build everything but do not publish (tag may be a branch)
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  cli:
    name: cli ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: windows-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:cli
      - name: Native binary
        if: matrix.target != 'windows-x64'
        run: node packages/native/scripts/release.mjs --out dist-release/native
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist-release/*.tar.gz
            dist-release/*.zip
            dist-release/native/*

  desktop:
    name: desktop ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: windows-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install hutch (Electrobun build CLI)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Install hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://hutch.blackboard.sh/hutch/install.ps1 | iex
          "$HOME\.hutch\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: hutch run install
        working-directory: apps/desktop
      - run: node apps/desktop/scripts/package.ts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist-release/Atento-desktop-*

  publish:
    needs: [cli, desktop]
    if: ${{ !cancelled() && needs.cli.result == 'success' && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd assets && find . -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS && cd ..
          node scripts/release/notes.mjs "$TAG" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifacts land in assets/, with the native binaries under
          # assets/native/. A shell glob would pass that directory to gh.
          mapfile -t FILES < <(find assets -type f ! -name SHA256SUMS | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "no release assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${FILES[@]}" --title "Atento ${TAG#v}" --notes-file notes.md --verify-tag
          fi
